<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #game{position:absolute;inset:0}
  .pad{position:absolute;bottom:4vh;display:flex;gap:2vw;z-index:10}
  #left{left:3vw} #right{right:3vw}
  .btn{width:16vmin;height:16vmin;border-radius:50%;border:2px solid #fff6;background:#ffffff26;
       color:#fff;font:700 6vmin sans-serif;display:flex;align-items:center;justify-content:center}
  .btn:active,.btn.on{background:#ffffff66}
  #msg{position:absolute;inset:0;color:#fff;font:16px sans-serif;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
</style></head>
<body>
<div id="game"></div>
<div id="msg">Ruffle not found.<br>Copy the Ruffle files into assets/ruffle/</div>
<div class="pad" id="left">
  <div class="btn" data-key="ArrowLeft" data-code="37">◀</div>
  <div class="btn" data-key="ArrowRight" data-code="39">▶</div>
</div>
<div class="pad" id="right">
  <div class="btn" data-key="ArrowUp" data-code="38">▲</div>
  <div class="btn" data-key="ArrowDown" data-code="40">▼</div>
  <div class="btn" data-key=" " data-code="32" style="font-size:3.5vmin">SPACE</div>
</div>
<script src="ruffle/ruffle.js" onerror="document.getElementById('msg').style.display='flex'"></script>
<script>
let player;
window.addEventListener("load", () => {
  if (!window.RufflePlayer) return;
  const ruffle = window.RufflePlayer.newest();
  player = ruffle.createPlayer();
  player.style.cssText = "width:100%;height:100%";
  document.getElementById("game").appendChild(player);
  player.load({url: "One_Chance.swf", autoplay: "on", unmuteOverlay: "hidden",
               letterbox: "on", contextMenu: "off", splashScreen: false});
});

function sendKey(type, key, code) {
  const ev = new KeyboardEvent(type, {key, code: key === " " ? "Space" : key, bubbles: true, cancelable: true});
  Object.defineProperty(ev, "keyCode", {get: () => code});
  Object.defineProperty(ev, "which", {get: () => code});
  (player || document).dispatchEvent(ev);
  const c = player && player.shadowRoot && player.shadowRoot.querySelector("canvas");
  if (c) c.dispatchEvent(new KeyboardEvent(type, {key, code: ev.code, bubbles: true}));
}

document.querySelectorAll(".btn").forEach(b => {
  const k = b.dataset.key, c = +b.dataset.code;
  const down = e => { e.preventDefault(); b.classList.add("on"); sendKey("keydown", k, c); };
  const up   = e => { e.preventDefault(); b.classList.remove("on"); sendKey("keyup", k, c); };
  b.addEventListener("touchstart", down, {passive:false});
  b.addEventListener("touchend", up, {passive:false});
  b.addEventListener("touchcancel", up, {passive:false});
});
</script>
</body></html>
