<style>

  .btn.on{background:#ffffff66}

  #top{position:absolute;bottom:3vh;left:50%;transform:translateX(-50%);display:flex;gap:1.5vw;z-index:10}

  body.clean .btn{background:none;border-color:transparent;color:transparent}
  #tg{position:absolute;top:0;left:0;width:8vmin;height:8vmin;z-index:20}
</style></head>
